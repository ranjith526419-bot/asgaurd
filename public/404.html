<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Ephemeral Secret Vault</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        margin: 0;
        background-color: #0a0a0a;
        color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader {
        text-align: center;
        font-size: 13px;
        color: #a1a1a1;
      }
    </style>
    <script>
      // Single Page Apps for GitHub Pages
      if (window.location.hostname.endsWith('github.io')) {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        var repoBase = l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/');
        var deepPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~');
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          repoBase + '/?/' +
          deepPath +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
    <div class="loader">
      <p>Redirecting to Ephemeral Secret Vault...</p>
    </div>
  </body>
</html>
